services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume_builder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_builder_dev_pass}
      POSTGRES_DB: resume_builder
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_builder_user -d resume_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://resume_builder_user:${POSTGRES_PASSWORD:-resume_builder_dev_pass}@db:5432/resume_builder
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env file}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && node server.js"

volumes:
  db_data:
